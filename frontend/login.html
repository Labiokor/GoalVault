<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoalVault | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col" data-page="login">

  <header class="fixed top-0 w-full bg-white/80 backdrop-blur-xl z-50 border-b border-slate-100">
    <nav class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
      <h1 class="text-xl font-black text-primary font-headline">GoalVault</h1>
      <a href="/register.html" class="text-sm font-semibold text-primary hover:underline">Create account</a>
    </nav>
  </header>

  <main class="flex-grow flex flex-col items-center justify-center pt-24 pb-12 px-6">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-xl p-8 md:p-10 shadow-sm border border-slate-100">

        <div class="mb-8">
          <h2 class="font-headline font-bold text-2xl md:text-3xl tracking-tight text-on-background mb-2">Welcome back</h2>
          <p class="text-on-surface-variant text-sm">Sign in to your GoalVault sanctuary</p>
        </div>

        <div id="auth-error" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-medium flex items-start gap-3">
          <span class="material-symbols-outlined text-sm shrink-0 mt-0.5">error</span>
          <span id="auth-error-text"></span>
        </div>

        <form id="login-form" class="space-y-5" novalidate>
          <div>
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" id="email" type="email"
                   placeholder="you@example.com"
                   autocomplete="email" required>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="form-label" for="password">Password</label>
              <a class="text-xs font-medium text-primary hover:underline" href="#">Forgot password?</a>
            </div>
            <input class="form-input" id="password" type="password"
                   placeholder="••••••••"
                   autocomplete="current-password" required>
          </div>

          <button class="w-full vault-gradient text-on-primary py-3.5 rounded-xl font-bold text-sm tracking-wide hover:opacity-95 active:scale-[0.98] transition-all"
                  type="submit" id="login-btn">
            Sign In
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-on-surface-variant">
            Don't have an account?
            <a class="text-primary font-semibold hover:underline ml-1" href="/register.html">Sign up free</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/modules/auth.js"></script>
</body>
</html>
