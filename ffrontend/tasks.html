<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Vault – Tasks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="brand-top-left">
            <h1>GOAL VAULT</h1>
            <p><strong>Plan.Focus.Achieve</strong></p>
        </div>
    </header>
    <div class="user-top-right">
        <button id="darkModeBtn" title="Toggle dark mode"></button>
        <div id="streakMenu" title="current streak">
            <span class="streak-icon">🔥</span>
            <span class="streak-count">0</span>
            <span class="streak-tooltip">Current streak: 0 days</span>
        </div>
    </div>

    <nav class="nav_bottom">
        <div class="nav-item">
            <a href="index.html">
                <i class="fa-solid fa-chart-line"></i>Dashboard
            </a>
        </div>
        <div class="nav-item">
            <a href="planner.html">
                <i class="fa-solid fa-calendar-check"></i>Goals
            </a>
        </div>
        <div class="nav-item">
            <a href="habits.html">
                <i class="fa-solid fa-check"></i>Habits
            </a>
        </div>
        <div class="nav-item">
            <a href="notebook.html">
                <i class="fas fa-sticky-note"></i>Notebook
            </a>
        </div>
        <div class="nav-item">
            <a href="tasks.html">
                <i class="fa-solid fa-list-check"></i>Tasks
            </a>
        </div>
        <div class="nav-item" style="position:relative;">
            <a href="notifications.html" style="position:relative;">
                <i class="fa-solid fa-bell"></i>
                <span class="notif-nav-badge" id="notifNavBadge"></span>
                Alerts
            </a>
        </div>
        <div class="nav-item">
        <a href="reminders.html">
            <i class="fa-solid fa-clock-rotate-left"></i>Reminders
        </a>
        </div>
            <div class="nav-item">
                <a href="account.html">
                    <i class="fa-solid fa-user"></i>My Account
                </a>
            </div>
    </nav>

    <div id="taskSection" class="section">
        <h2>Focus Lane</h2>
        <p>manage your productivity and track progress</p>
        <div class="task-progress-wrapper">
            <div class="task-progress-header">
                <div class="task-progress-label">Task progress
                    <span class="task-progress-count" id="taskProgressCount">0 of 0 completed</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="taskProgressBar">0%</div>
                </div>
            </div>
            <div class="category-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="general">General</button>
                <button class="filter-btn" data-filter="work">Work</button>
                <button class="filter-btn" data-filter="personal">Personal</button>
                <button class="filter-btn" data-filter="school">School</button>
            </div>
            <ul id="tasklist"></ul>
            <div class="task-input-area">
                <input type="text" id="taskinput" placeholder="Add a task...">
                <select id="prioritySelect">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select>
                <select id="categorySelect">
                    <option value="general">general</option>
                    <option value="work">work</option>
                    <option value="personal">personal</option>
                    <option value="school">school</option>
                </select>
                <input type="date" id="taskDeadline">
                <button id="addTaskBtn">Add</button>
            </div>
        </div>
    </div>
    <!-- ── Confirm Delete Modal ── -->
    <div id="confirmModal" style="display:none;">
    <div class="confirm-backdrop"></div>
    <div class="confirm-box">
        <div class="confirm-icon">🗑️</div>
        <h3 class="confirm-title">Are you sure?</h3>
        <p class="confirm-msg" id="confirmMsg">
            This action cannot be undone.
        </p>
        <div class="confirm-actions">
            <button class="confirm-cancel" id="confirmCancel">
                Cancel
            </button>
            <button class="confirm-delete" id="confirmDelete">
                Delete
            </button>
        </div>
    </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
